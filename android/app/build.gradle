plugins {
    id 'com.android.application'
}

android {
    namespace 'com.writemaster.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.writemaster.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 依賴輕量標準庫
}
